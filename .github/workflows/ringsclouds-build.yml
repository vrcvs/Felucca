name: RingsClouds firmware build

on:
  push:
    branches:
      - ringsclouds-analysis
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ringsclouds-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source and engines submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check Pillow fonttools

      - name: Download JieLi toolchain
        run: sh tools/get_toolchain.sh "$HOME/.jieli"

      - name: Download JieLi AC79 SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$RUNNER_TEMP/fw-AC79_AIoT_SDK"

      - name: Build installable package
        env:
          AC79_SDK: ${{ runner.temp }}/fw-AC79_AIoT_SDK
        run: ./build.sh --release 1.6.1-rc1

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ringsclouds-build-diagnostics
          path: build/felucca.dis
          if-no-files-found: warn
          retention-days: 3

      - name: Upload firmware package and release files
        uses: actions/upload-artifact@v4
        with:
          name: ringsclouds-1.6.1-rc1
          path: build/release-1.6.1-rc1/
          if-no-files-found: error
          retention-days: 14
